version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: cron_app
        volumes:
            - .:/var/www
        environment:
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=laravel
            - DB_USERNAME=root
            - DB_PASSWORD=secret
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        container_name: cron_mysql
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: laravel
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:alpine

volumes:
    mysql_data:
